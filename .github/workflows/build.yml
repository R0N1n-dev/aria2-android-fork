name: Build and Release aria2 for Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout base repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Pulls full history securely without breaking git targets

    - name: Initialize and Pull Submodules Natively
      run: |
        # Natively pull down dependencies to avoid directory metadata corruption
        git submodule update --init --recursive

    - name: Install System Compilation Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autopoint gettext build-essential pkg-config \
          autoconf automake libtool libtool-bin texinfo tcl-dev

    - name: Set up Android SDK & NDK r23c
      uses: android-actions/setup-android@v4
      with:
        packages: 'ndk;23.1.7779620 platform-tools'

    - name: Map Android NDK Home Path
      run: |
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/23.1.7779620" >> $GITHUB_ENV

    - name: Force Patch Autotools Macro Lookups
      run: |
        echo "Applying macro directory inclusion rules..."
        # Physically link macro folders together to resolve the ARIA2_ARG_WITH(libuv) build failure
        mkdir -p m4 aria2/m4
        if [ -d "aria2/m4" ]; then
          cp -r aria2/m4/* m4/ 2>/dev/null || true
          cp -r m4/* aria2/m4/ 2>/dev/null || true
        fi
        
        # Hardcode the include path flag into every single compile initialization file inside the workspace
        find . -name "*.sh" -type f -exec sed -i 's/autoreconf -i/autoreconf -i -I m4/g' {} +
        find . -name "*.sh" -type f -exec sed -i 's/autoreconf -f -i/autoreconf -f -i -I m4/g' {} +

    - name: Run Build Script
      run: |
        chmod +x build_all.sh
        export ACLOCAL_PATH="$(pwd)/aria2/m4:$(pwd)/m4:/usr/share/aclocal"
        export CONFIG_SHELL=/bin/bash
        ./build_all.sh

    - name: Strip Debug Symbols
      run: |
        echo "Locating NDK strip tool..."
        STRIP_TOOL=$(find ${ANDROID_NDK_HOME} -name llvm-strip -type f | head -n 1)
        if [ -z "$STRIP_TOOL" ]; then
          echo "Warning: llvm-strip not found. Skipping stripping step."
        else
          find bin/ -type f -not -name "*.txt" -not -name "*.sh" -exec "$STRIP_TOOL" --strip-unneeded {} +
          echo "Stripping complete!"
        fi

    - name: Zip Binaries for Release
      run: |
        zip -r aria2-android-binaries.zip bin/

    - name: Upload Artifact (Backup)
      uses: actions/upload-artifact@v4
      with:
        name: aria2-android-binaries
        path: aria2-android-binaries.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.ref_name }} aria2-android-binaries.zip \
          --title "aria2 Android Binaries ${{ github.ref_name }}" \
          --notes "Automated optimized and stripped cross-compiled binaries for armeabi-v7a, arm64-v8a, x86, and x86_64 using NDK r23c."
