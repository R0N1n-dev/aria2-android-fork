name: Build and Release aria2 for Android

on:
  push:
    tags:
      - "v*" # Triggers automatically when you push a tag starting with 'v' (e.g., v1.36.0)
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Crucial permission allowing GitHub Actions to create a Release

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android NDK r23c
        uses: android-actions/setup-android@v3
        id: setup-ndk
        with:
          ndk-version: "23.1.7779620"

      - name: Run Build Script
        run: |
          chmod +x build_all.sh
          ./build_all.sh

      - name: Strip Debug Symbols
        run: |
          echo "Locating NDK strip tool..."
          # Finds the llvm-strip tool inside the installed r23c NDK directory
          STRIP_TOOL=$(find ${{ steps.setup-ndk.outputs.ndk-path }} -name llvm-strip -type f | head -n 1)

          if [ -z "$STRIP_TOOL" ]; then
            echo "Warning: llvm-strip not found. Skipping stripping step."
          else
            echo "Using strip tool: $STRIP_TOOL"
            # Find all executable binaries inside the bin folder and strip them
            find bin/ -type f -not -name "*.txt" -not -name "*.sh" -exec "$STRIP_TOOL" --strip-unneeded {} +
            echo "Stripping complete!"
          fi

      - name: Zip Binaries for Release
        run: |
          zip -r aria2-android-binaries.zip bin/

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: aria2-android-binaries
          path: aria2-android-binaries.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') # Only runs this step if triggered by a tag push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} aria2-android-binaries.zip \
            --title "aria2 Android Binaries ${{ github.ref_name }}" \
            --notes "Automated optimized and stripped cross-compiled binaries for armeabi-v7a, arm64-v8a, x86, and x86_64 using NDK r23c."
